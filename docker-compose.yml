services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: laravel-app:latest
    container_name: laravel-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - app-network
      - shared-db

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: laravel-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - app-network

  queue:
    image: laravel-app:latest
    container_name: laravel-queue
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work --tries=3
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - app-network
      - shared-db

volumes:
  app_storage:

networks:
  app-network:
    driver: bridge
  shared-db:
    external: true
    name: shared-db